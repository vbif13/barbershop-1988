<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="logo-mark.svg" type="image/svg+xml">

<body data-page="home" data-title="meta.home">

        <div class="hero__glow" aria-hidden="true"></div>
        <div class="hero__logo-wrap"><img class="hero__logo" src="logo-original.jpg" alt="Бренд авторских барбершопов Гусейнова Рамиля — BARBERSHOP 1988, основан в 2017 году"><span class="hero__shine" aria-hidden="true"></span></div>
      </div>
      <div class="hero__in">
        <h1 class="sr-only">BARBERSHOP 1988</h1>
        <p class="hero__line fade-late" data-i18n="home.hero.line"></p>
        <div class="btn-row fade-late">
          <a class="btn btn--wood" data-dk><span data-i18n="btn.book"></span></a>

        </div>
        <div class="intro__media">
          <img src="https://images.unsplash.com/photo-1781455793310-8427c96454c7?auto=format&fit=crop&w=1800&q=88" alt="" loading="lazy">
        </div>
      </div>
    </section>

    <section class="block" id="prices">
      <div class="wrap">
        <div class="block__head"><h2 class="h2" data-i18n="home.prices.title"></h2></div>
        <h3 class="h3" data-i18n="sec.cuts"></h3>
        <table class="prices">
          <tr><td><span class="p-name" data-i18n="cuts1"></span><span class="p-desc" data-i18n="cuts1.d"></span></td><td class="p-time"></td><td class="p-price"><span data-i18n="from">от</span> 1 500 ₽</td></tr>
          <tr><td><span class="p-name" data-i18n="cuts2"></span><span class="p-desc" data-i18n="cuts2.d"></span></td><td class="p-time"></td><td class="p-price"><span data-i18n="from">от</span> 1 500 ₽</td></tr>
          </table>
        <h3 class="h3" data-i18n="sec.kids"></h3>

          <tr><td><span class="p-name" data-i18n="kids1"></span><span class="p-desc" data-i18n="kids1.d"></span></td><td class="p-time"></td><td class="p-price"><span data-i18n="from">от</span> 1 500 ₽</td></tr>
          </table>
        <h3 class="h3" data-i18n="sec.beard"></h3>
        <table class="prices">
          <tr><td><span class="p-name" data-i18n="beard1"></span></td><td class="p-time"></td><td class="p-price"><span data-i18n="from">от</span> 1 800 ₽</td></tr>

        <h3 class="h3" data-i18n="sec.extra"></h3>

          <a class="tile" href="services.html#kids">
            <img src="https://images.unsplash.com/photo-1675599193990-33d71150902b?auto=format&fit=crop&w=1800&q=88" alt="" loading="lazy">

            <p class="text" data-i18n="dir.kids.d"></p>

          <a class="tile" href="services.html#extra">
            <img src="https://images.unsplash.com/photo-1675599193741-e6f078a65fbd?auto=format&fit=crop&w=1800&q=88" alt="" loading="lazy">
            <h3 class="h3" data-i18n="dir.extra"></h3>
            <p class="text" data-i18n="dir.extra.d"></p>
            <span class="tile__link" data-i18n="home.srv.link"></span>
          </a>
        </div>

        <div class="flag flag--stone" aria-hidden="true"><span class="flag__word">1988</span><span data-mark data-mono></span></div>
        <div class="open__body">
          <h2 class="h2" data-i18n="home.open.title"></h2>
          <p class="text text--lead" data-i18n="home.open.p"></p>
        </div>
      </div>

    <section class="block block--pine">
      <div class="wrap">
        <div class="block__head"><h2 class="h2" data-i18n="home.steps.title"></h2></div>

          <li><h3 class="h3" data-i18n="step1"></h3><p class="text" data-i18n="step1.d"></p></li>
